services:
  furnix-next:
    container_name: furnix-next
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://147.93.103.154:5001}
        REACT_APP_API_GRAPHQL_URL: ${REACT_APP_API_GRAPHQL_URL:-http://147.93.103.154:5001/graphql}
        REACT_APP_API_WS: ${REACT_APP_API_WS:-ws://147.93.103.154:5001}
    environment:
      NODE_ENV: production
      PORT: 3000
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://147.93.103.154:5001}
      REACT_APP_API_GRAPHQL_URL: ${REACT_APP_API_GRAPHQL_URL:-http://147.93.103.154:5001/graphql}
      REACT_APP_API_WS: ${REACT_APP_API_WS:-ws://147.93.103.154:5001}
    ports:
      - "${FRONT_PORT:-5000}:3000"
    networks:
      - client-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  client-network:
    driver: bridge
